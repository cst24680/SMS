<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyBuddy | Log In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <!-- Sticky Header Navbar -->
  <header class="border-b border-slate-200/70 bg-white/90 backdrop-blur sticky top-0 z-50 text-slate-900">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
      <a href="index.html" class="flex items-center gap-3 no-underline">
        <div class="flex h-10 w-10 items-center justify-center rounded-2xl bg-emerald-600 text-lg font-bold text-white shadow-lg">S</div>
        <div class="text-left">
          <p class="text-lg font-semibold text-slate-900 m-0">StudyBuddy</p>
          <p class="text-xs text-slate-500 m-0">Nearby learning community</p>
        </div>
      </a>
      <nav class="flex items-center gap-3 text-sm font-medium text-slate-600">
        <a href="login.html" class="rounded-full px-4 py-2 hover:bg-slate-100 text-slate-700 no-underline">Log In</a>
        <a href="signup.html" class="rounded-full bg-emerald-600 px-4 py-2 text-white hover:bg-emerald-700 no-underline">Sign Up</a>
      </nav>
    </div>
  </header>

  <div class="auth-shell">
    <div class="auth-card">
      <a href="index.html" class="auth-link">← Back to home</a>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Log in to continue your study journey and access your goals.</p>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="mb-2 block text-sm font-semibold text-slate-700">Email</label>
          <input id="loginEmail" type="email" placeholder="you@example.com" class="input-field" required>
        </div>
        <div>
          <label class="mb-2 block text-sm font-semibold text-slate-700">Password</label>
          <input id="loginPassword" type="password" placeholder="Enter your password" class="input-field" required>
        </div>
        <button type="submit" class="btn btn-primary w-full justify-center">Log In</button>
      </form>

      <script src="app.js"></script>

      <div class="auth-divider">or</div>
      <p class="text-center text-sm text-slate-600">
        New here? <a href="signup.html" class="auth-link">Create an account</a>
      </p>
    </div>
  </div>
</body>
</html>
